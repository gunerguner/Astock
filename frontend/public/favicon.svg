  />
  <path d="M12 19v3" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- 实心 K（阳） -->
  <path d="M20 9v2" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <rect x="18" y="11" width="4" height="7" rx="1" fill="#ffffff"/>
  <path d="M20 18v3" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
